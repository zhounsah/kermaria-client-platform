map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream kermaria_webportal {
    server 192.168.100.212:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name zachary-it.fr www.zachary-it.fr dashboard.zachary-it.fr administration.zachary-it.fr;
    server_tokens off;

    access_log /var/log/nginx/kermaria-access.log;
    error_log /var/log/nginx/kermaria-error.log warn;

    client_max_body_size 25m;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_pass http://kermaria_webportal;
    }
}
