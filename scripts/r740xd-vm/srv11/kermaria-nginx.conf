# =====================================================================
# GABARIT PERIME — NE PAS DEPOSER TEL QUEL SUR SRV-11.
#
# Constate le 2026-08-05 en comparant avec
# /etc/nginx/sites-available/kermaria sur SRV-11 : la production a diverge.
#
#                        ce fichier        production
#   lignes               83                148
#   blocs `server`       2                 4
#   ecoute TLS           443 (direct)      127.0.0.1:8443 ssl proxy_protocol
#   vhost portfolio      absent            present (portfolio.zacharyhounsa.ovh)
#
# La production termine donc le TLS derriere un frontal qui relaie en
# PROXY protocol, et sert un vhost `portfolio` que ce gabarit ignore.
# Ecraser le fichier de production avec celui-ci ferait perdre les deux.
#
# Ce gabarit reste la reference pour les *directives* (dont l'absence
# volontaire d'`add_header`, cf. plus bas), pas pour la topologie.
# Toute intervention sur SRV-11 se fait par edition ciblee du fichier en
# place, avec sauvegarde prealable — voir docs/OPERATIONS.md.
# =====================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream kermaria_webportal {
    server 192.168.100.212:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name zachary-it.fr www.zachary-it.fr dashboard.zachary-it.fr administration.zachary-it.fr;

    access_log /var/log/nginx/kermaria-access.log;
    error_log /var/log/nginx/kermaria-error.log warn;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name zachary-it.fr www.zachary-it.fr dashboard.zachary-it.fr administration.zachary-it.fr;

    ssl_certificate /etc/ssl/kermaria/fullchain.pem;
    ssl_certificate_key /etc/ssl/kermaria/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:KermariaSSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    access_log /var/log/nginx/kermaria-access.log;
    error_log /var/log/nginx/kermaria-error.log warn;

    client_max_body_size 25m;

    # En-tetes de securite : AUCUN ici, volontairement.
    #
    # L'application est seule source de verite (tableau SECURITY_HEADERS de
    # apps/webportal/next.config.ts, 7 en-tetes, couvert par
    # `npm run test:operations`). Ce proxy relaie sans ajouter.
    #
    # Les quatre `add_header` qui se trouvaient ici emettaient une SECONDE
    # ligne a cote de celle de l'amont — `add_header` n'ecrase jamais un
    # en-tete amont. La production a servi `X-Frame-Options: DENY, SAMEORIGIN`
    # jusqu'au 2026-08-05. Voir docs/SECURITY.md.
    #
    # Si une valeur doit un jour etre imposee ici, ecrire imperativement :
    #   proxy_hide_header <nom>;
    #   add_header <nom> "<valeur>" always;
    # et ne jamais ajouter d'`add_header` dans un bloc `location` sans
    # rappeler ceux du bloc `server` : un `add_header` local les annule tous.
    #
    # Ne pas ajouter `X-Robots-Tag` : la vitrine publique doit rester
    # indexable, l'application gere cet en-tete par prefixe de route.
    #
    # `Strict-Transport-Security` reste volontairement absent tant que la
    # bascule publique n'est pas stabilisee (cf. docs/DEPLOYMENT_R740XD_VM.md).

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_pass http://kermaria_webportal;
    }
}
