map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream kermaria_webportal {
    server 192.168.100.212:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.zacharyhounsa.ovh dashboard.zacharyhounsa.ovh administration.zacharyhounsa.ovh;

    access_log /var/log/nginx/kermaria-access.log;
    error_log /var/log/nginx/kermaria-error.log warn;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.zacharyhounsa.ovh dashboard.zacharyhounsa.ovh administration.zacharyhounsa.ovh;

    ssl_certificate /etc/ssl/kermaria/fullchain.pem;
    ssl_certificate_key /etc/ssl/kermaria/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:KermariaSSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    access_log /var/log/nginx/kermaria-access.log;
    error_log /var/log/nginx/kermaria-error.log warn;

    client_max_body_size 25m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_pass http://kermaria_webportal;
    }
}
